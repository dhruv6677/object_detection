<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Sign Language Detection</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #1a1a2e;
            color: white;
            padding: 30px;
        }

        h1 {
            color: #e94560;
        }

        .btn {
            background: #e94560;
            color: white;
            padding: 10px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px;
        }

        .btn:hover {
            background: #c73652;
        }

        #result-img {
            max-width: 600px;
            margin-top: 20px;
            border-radius: 10px;
        }

        #detections {
            margin-top: 15px;
            font-size: 18px;
        }

        input[type=file] {
            margin: 20px;
            padding: 10px;
        }

        a {
            color: #e94560;
            font-size: 18px;
        }
    </style>
</head>

<body>
    <h1>🤟 Sign Language Detection</h1>
    <p><a href="/live">📷 Go to Live Webcam Detection →</a></p>
    <hr>
    <h2>Upload Image for Prediction</h2>
    <input type="file" id="imageInput" accept="image/*">
    <br>
    <button class="btn" onclick="predict()">Detect Sign</button>
    <div id="detections"></div>
    <br>
    <img id="result-img" src="" style="display:none;">

    <script>
        async function predict() {
            const file = document.getElementById('imageInput').files[0];
            if (!file) { alert('Please select an image!'); return; }

            const reader = new FileReader();
            reader.onload = async function (e) {
                const base64 = e.target.result.split(',')[1];

                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: base64 })
                });

                const data = await response.json();

                // Show result image
                const img = document.getElementById('result-img');
                img.src = 'data:image/jpeg;base64,' + data.image;
                img.style.display = 'block';

                // Show detections
                const det = document.getElementById('detections');
                if (data.detections.length === 0) {
                    det.innerHTML = '❌ No sign detected';
                } else {
                    det.innerHTML = data.detections.map(d =>
                        `✅ <b>${d.label}</b> (${(d.confidence * 100).toFixed(1)}%)`
                    ).join('<br>');
                }
            };
            reader.readAsDataURL(file);
        }
    </script>
</body>

</html>
